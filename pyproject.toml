[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-catchup"
version = "0.3.0"
description = "Catch up on where you left off. A local-LLM briefing for git repos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
git-catchup = "gitcatchup.cli:main"

[tool.setuptools]
packages = ["gitcatchup"]
